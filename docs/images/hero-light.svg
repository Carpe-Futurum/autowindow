<svg xmlns="http://www.w3.org/2000/svg" class="heroArt" viewBox="0 0 1000 400" role="img" aria-label="Windows arranged across a laptop, a main monitor with four desktops and a portrait monitor. When the monitors are unplugged the windows pile up on the laptop; when they are plugged back in, AutoWindow moves every window back to its place."><title>Windows arranged across a laptop, a main monitor with four desktops and a portrait monitor. When the monitors are unplugged the windows pile up on the laptop; when they are plugged back in, AutoWindow moves every window back to its place.</title><style>svg{--screen:#dfe6f3;--screen-edge:#b9c2d3;--win:#ffffff;--win-edge:#c9d0dc;--muted:#5d6470;--ink:#15171a;--accent:#2f6bff;--accent-ink:#ffffff;--t1:#7c8cf8;--t2:#f29d6b;--t3:#57c7a2;--t4:#e879a8;--t5:#e6c44f;--t6:#6bb8f2;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.mover{animation:awPile 12s ease-in-out infinite}
.external{animation:awExternal 12s ease-in-out infinite}
.unplugged{opacity:0;animation:awUnplugged 12s ease-in-out infinite}
.restored{opacity:0;animation:awRestored 12s ease-in-out infinite}
@keyframes awPile{0%,22%{transform:none}32%,56%{transform:translate(var(--dx),var(--dy)) scale(var(--s))}68%,100%{transform:none}}
@keyframes awExternal{0%,22%{opacity:1}26%,56%{opacity:.2}60%,100%{opacity:1}}
@keyframes awUnplugged{0%,24%{opacity:0}28%,54%{opacity:1}58%,100%{opacity:0}}
@keyframes awRestored{0%,68%{opacity:0}72%,92%{opacity:1}97%,100%{opacity:0}}
