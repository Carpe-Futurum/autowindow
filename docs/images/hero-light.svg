 fill="var(--muted)" font-family="inherit">Unplugged</text><text x="860" y="186" text-anchor="middle" font-size="18" font-weight="600" fill="var(--muted)" font-family="inherit">Unplugged</text></g><g opacity="1"><rect x="46" y="166" width="198" height="104" rx="5" fill="var(--win)" stroke="var(--win-edge)" stroke-width="1"></rect><path d="M46,177 V171 a5,5 0 0 1 5,-5 H239 a5,5 0 0 1 5,5 V177 Z" fill="var(--t3)"></path><rect x="69.75999999999999" y="193.64" width="99" height="3" rx="1.5" fill="var(--win-edge)"></rect><rect x="69.75999999999999" y="202.64" width="67.32000000000001" height="3" rx="1.5" fill="var(--win-edge)"></rect></g><g class="mover" style="transform-origin:306px 56px;animation-delay:0s;--dx:-250px;--dy:116px;--s:0.469"><g opacity="1"><rect x="306" y="56" width="196" height="210" rx="5" fill="var(--win)" stroke="var(--win-edge)" stroke-width="1"></rect><path d="M306,67 V61 a5,5 0 0 1 5,-5 H497 a5,5 0 0 1 5,5 V67 Z" fill="var(--t1)"></path><rect x="329.52" y="100.6" width="98" height="3" rx="1.5" fill="var(--win-edge)"></rect><rect x="329.52" y="109.6" width="66.64" height="3" rx="1.5" fill="var(--win-edge)"></rect></g></g><g class="mover" style="transform-origin:508px 56px;animation-delay:0.08s;--dx:-428px;--dy:123px;--s:0.469"><g opacity="1"><rect x="508" y="56" width="196" height="210" rx="5" fill="var(--win)" stroke="var(--win-edge)" stroke-width="1"></rect><path d="M508,67 V61 a5,5 0 0 1 5,-5 H699 a5,5 0 0 1 5,5 V67 Z" fill="var(--t2)"></path><rect x="531.52" y="100.6" width="98" height="3" rx="1.5" fill="var(--win-edge)"></rect><rect x="531.52" y="109.6" width="66.64" height="3" rx="1.5" fill="var(--win-edge)"></rect></g></g><g class="mover" style="transform-origin:560px 120px;animation-delay:0.16s;--dx:-456px;--dy:66px;--s:0.767"><g opacity="1"><rect x="560" y="120" width="120" height="90" rx="5" fill="var(--win)" stroke="var(--win-edge)" stroke-width="1"></rect><path d="M560,131 V125 a5,5 0 0 1 5,-5 H675 a5,5 0 0 1 5,5 V131 Z" fill="var(--t5)"></path><rect x="574.4" y="145.4" width="60" height="3" rx="1.5" fill="var(--win-edge)"></rect><rect x="574.4" y="154.4" width="40.800000000000004" height="3" rx="1.5" fill="var(--win-edge)"></rect></g></g><g class="mover" style="transform-origin:766px 36px;animation-delay:0.24s;--dx:-638px;--dy:157px;--s:0.489"><g opacity="1"><rect x="766" y="36" width="188" height="150" rx="5" fill="var(--win)" stroke="var(--win-edge)" stroke-width="1"></rect><path d="M766,47 V41 a5,5 0 0 1 5,-5 H949 a5,5 0 0 1 5,5 V47 Z" fill="var(--t4)"></path><rect x="788.56" y="71" width="94" height="3" rx="1.5" fill="var(--win-edge)"></rect><rect x="788.56" y="80" width="63.92" height="3" rx="1.5" fill="var(--win-edge)"></rect></g></g><g class="mover" style="transform-origin:766px 194px;animation-delay:0.32s;--dx:-614px;--dy:6px;--s:0.489"><g opacity="1"><rect x="766" y="194" width="188" height="110" rx="5" fill="var(--win)" stroke="var(--win-edge)" stroke-width="1"></rect><path d="M766,205 V199 a5,5 0 0 1 5,-5 H949 a5,5 0 0 1 5,5 V205 Z" fill="var(--t6)"></path><rect x="788.56" y="222.6" width="94" height="3" rx="1.5" fill="var(--win-edge)"></rect><rect x="788.56" y="231.6" width="63.92" height="3" rx="1.5" fill="var(--win-edge)"></rect></g></g><g class="restored" aria-hidden="true"><rect x="40" y="92" width="210" height="34" rx="17" fill="var(--accent)"></rect><path d="M60 109 l6 6 l11 -12" stroke="var(--accent-ink)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="86" y="114" font-size="14" font-weight="700" fill="var(--accent-ink)" font-family="inherit">Layout restored</text></g></svg>
